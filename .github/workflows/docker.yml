name: Build and Push Docker Image to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., 1.4.6, latest)'
        required: true
        default: 'latest'

jobs:
  # Build each architecture on a native runner. Emulating the Node toolchain
  # under QEMU intermittently dies with SIGILL, and native runners also
  # produce correct native addons for @libsql/client.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/flexvault

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.selfhosted
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Combine the per-architecture digests into the tagged multi-arch manifest.
  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/flexvault

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          images=()
          for file in /tmp/digests/*; do
            images+=("${IMAGE}@sha256:$(basename "${file}")")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${TAG}" \
            "${images[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Build summary
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "Image: \`${IMAGE}:${TAG}\`"
            echo ""
            echo "### Platforms"
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo ""
            echo "### Pull Command"
            echo '```'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A successful push does not prove the image is usable. Build the amd64 image
  # locally and verify the Web Vault is actually served (the historical
  # regression was `/` returning 401 because dist/ was missing from the image).
  verify-image:
    needs: merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.selfhosted
          platforms: linux/amd64
          load: true
          tags: flexvault:smoke
          cache-from: type=gha,scope=amd64

      - name: Run container
        run: |
          # Generate the throwaway signing key at runtime so no literal secret
          # ends up in the repository (secret scanners flag embedded values).
          docker run -d --name flexvault-smoke \
            -p 3000:3000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            flexvault:smoke

      - name: Smoke test endpoints
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/version > /dev/null; then
              echo "Server is up after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Server did not become ready" >&2
              docker logs flexvault-smoke >&2
              exit 1
            fi
            sleep 2
          done

          root_status=$(curl -sS -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:3000/)
          test "$root_status" = "200" || {
            echo "GET / returned ${root_status}, expected 200 (Web Vault missing?)" >&2
            cat /tmp/root.html >&2
            exit 1
          }
          grep -q 'id="root"' /tmp/root.html
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-type: text/html'

          asset_path=$(grep -oE '/assets/[^"]+\.js' /tmp/root.html | head -n 1)
          test -n "$asset_path"
          curl -fsS "http://127.0.0.1:3000${asset_path}" > /dev/null
          curl -fsSI "http://127.0.0.1:3000${asset_path}" | grep -qi '^cache-control:.*immutable'

          echo "Smoke test passed"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs flexvault-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f flexvault-smoke || true
