services:
  nodewarden:
    build:
      context: .
      dockerfile: Dockerfile.selfhosted
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/app/data/nodewarden.db
      - STORAGE_PATH=/app/data/attachments
      - PORT=3000
      - HOST=0.0.0.0
      # Set to 1 only when the container is behind a reverse proxy you control.
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Deprecated: allows long-lived access tokens in the WebSocket query string.
      - ALLOW_LEGACY_WS_QUERY_TOKEN=${ALLOW_LEGACY_WS_QUERY_TOKEN:-0}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-104857600}
      # Required for WebAuthn/passkeys when the public origin differs from the
      # host header seen by the container.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ALLOWED_ORIGINS=${WEBAUTHN_ALLOWED_ORIGINS:-}
    volumes:
      # Keep the historical volume name so existing deployments do not lose data.
      - nodewarden-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nodewarden-data:
